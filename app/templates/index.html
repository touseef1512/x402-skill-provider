<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent OS: Convergence Provider</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; }
        .card { background-color: #161b22; border: 1px solid #30363d; }
        .text-binance { color: #FCD535; }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <h2 class="text-binance mb-4">⚡ x402 Convergence Signal Provider</h2>
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="card p-3 h-100">
                    <h4>Incoming x402 Settlements</h4>
                    <ul class="list-group list-group-flush" id="payment-log">
                        <li class="list-group-item bg-transparent text-light border-secondary">
                            Waiting for Agent requests...
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card p-3 h-100">
                    <h4>Active Alpha Delivery</h4>
                    <pre class="bg-dark p-3 rounded border border-secondary text-success" id="alpha-log">System Idle...</pre>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // For the hackathon demo, we simulate the UI catching the backend logs
        function simulateIncomingRequest(symbol, score, signal) {
            const txHash = "0x" + Math.random().toString(16).substr(2, 10);
            document.getElementById('payment-log').innerHTML = `
                <li class="list-group-item bg-transparent text-success border-secondary">
                    [Verified] 0.50 USDC from agent_alpha_seeker <br>
                    <small class="text-muted">Hash: ${txHash}</small>
                </li>`;
            
            document.getElementById('alpha-log').innerText = JSON.stringify({
                asset: symbol,
                social_exhaustion_score: score,
                mcp_sell_wall_detected: true,
                signal: signal
            }, null, 2);
        }
    </script>
</body>
</html>
